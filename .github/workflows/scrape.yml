name: scrape wiki

on:
  schedule:
    # wednesday night → thursday morning UTC (episodes air wednesday evening US)
    - cron: '0 2,4,6,8 * * 4'  # thursday 2am, 4am, 6am, 8am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: node scripts/scrape.js

      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "update s50 data from wiki scrape"
            git push
          fi
